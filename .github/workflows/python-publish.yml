# Builds and uploads the package to PyPI with uv.
# Runs on a published release, or manually for a given tag (dry run by default).
# Only org allow-listed actions are used; build/check/publish are plain uv commands.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v4.4.0)"
        required: true
      dry_run:
        description: "Run every step but skip the upload (uv publish --dry-run)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.0
      with:
        ref: ${{ inputs.tag || github.ref }}
    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.0
    - name: Build package
      run: uv build
    - name: Check distributions
      run: uvx twine check --strict dist/*
    - name: Verify version matches tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        version="$(uv version --short)"
        if [ "$version" != "${TAG#v}" ]; then
          echo "::error::Package version $version does not match tag $TAG"
          exit 1
        fi
    - name: Publish package
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
      run: uv publish $DRY_RUN
