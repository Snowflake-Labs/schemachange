# Builds and uploads the package to PyPI with uv, using PyPI Trusted Publishing (OIDC).
# Runs on a published release, or manually for a given tag (dry run by default).
# `build` holds no OIDC token. `publish` runs in the `pypi` environment (reviewer-gated),
# signs the distributions (PEP 740 provenance), and uploads them; dry runs skip it.
# Only org allow-listed actions are used; build/check/sign/publish are plain uv commands.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v4.4.0)"
        required: true
      dry_run:
        description: "Build and check only; skip signing and the upload"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.0
      with:
        ref: ${{ inputs.tag || github.ref }}
    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.0
    - name: Build package
      run: uv build
    - name: Check distributions
      run: uvx twine check --strict dist/*
    - name: Verify version matches tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        version="$(uv version --short)"
        if [ "$version" != "${TAG#v}" ]; then
          echo "::error::Package version $version does not match tag $TAG"
          exit 1
        fi
    - name: Upload distributions
      uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/schemachange/

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/
    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.0
    - name: Sign distributions (PEP 740)
      run: uvx --from 'pypi-attestations>=0.0.30' pypi-attestations sign dist/*.whl dist/*.tar.gz
    - name: Publish package
      run: uv publish --trusted-publishing always
